name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gato-de-Tela-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare release key
        if: ${{ env.KEY_B64 != '' }}
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        if: ${{ env.KEY_B64 != '' }}
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ env.KEY_B64 != '' }}
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        with:
          name: Gato-de-Tela-release
          path: app/build/outputs/apk/release/*.apk
  android-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Gato-de-Tela-debug
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test install and foreground overlay on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" python3 verification/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-15-smoke-results
          path: |
            verification/android-*.png
            verification/android-*.txt
            verification/android-*.log
            verification/android-smoke.json

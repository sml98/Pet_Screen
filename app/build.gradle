plugins { id 'com.android.application' }
android {
 namespace 'com.catpack.pet'
 compileSdk 35
 defaultConfig { applicationId 'com.catpack.pet'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
 signingConfigs {
  release {
   storeFile file(System.getenv('RELEASE_STORE_FILE') ?: 'release.jks')
   storePassword System.getenv('RELEASE_STORE_PASSWORD')
   keyAlias System.getenv('RELEASE_KEY_ALIAS')
   keyPassword System.getenv('RELEASE_KEY_PASSWORD')
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
